<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Her Circle activity board</title>
  <desc id="desc">A pink activity board with words representing reflection, creativity, focus and connection.</desc>
  <rect width="760" height="560" rx="28" fill="#fff0f6"/>
  <rect x="62" y="58" width="636" height="444" rx="24" fill="#ffffff" stroke="#f1bfd3" stroke-width="3"/>
  <circle cx="130" cy="125" r="34" fill="#e91e63"/>
  <text x="130" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">HC</text>
  <text x="190" y="117" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#4a1730">Make room for you.</text>
  <rect x="102" y="194" width="250" height="108" rx="16" fill="#ffe0eb"/>
  <text x="128" y="237" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c2185b">REFLECT</text>
  <text x="128" y="270" font-family="Arial, sans-serif" font-size="18" fill="#7a4a61">Your voice matters.</text>
  <rect x="408" y="194" width="250" height="108" rx="16" fill="#fce4ec"/>
  <text x="434" y="237" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c2185b">CREATE</text>
  <text x="434" y="270" font-family="Arial, sans-serif" font-size="18" fill="#7a4a61">Follow your curiosity.</text>
  <rect x="102" y="340" width="250" height="108" rx="16" fill="#f8bbd0"/>
  <text x="128" y="383" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#880e4f">FOCUS</text>
  <text x="128" y="416" font-family="Arial, sans-serif" font-size="18" fill="#7a4a61">Small wins count.</text>
  <rect x="408" y="340" width="250" height="108" rx="16" fill="#ffe0eb"/>
  <text x="434" y="383" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#880e4f">CONNECT</text>
  <text x="434" y="416" font-family="Arial, sans-serif" font-size="18" fill="#7a4a61">Bring your whole self.</text>
</svg>
