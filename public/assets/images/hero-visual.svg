<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Girls Fun Hub activity collage</title>
  <desc id="desc">Abstract colorful tiles representing games, quizzes, polls, and community posts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6f3"/>
      <stop offset="0.43" stop-color="#ffe5eb"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6f61"/>
      <stop offset="1" stop-color="#d93f87"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#15aabf"/>
      <stop offset="1" stop-color="#7257d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4c2442" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="760" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="642" cy="98" r="54" fill="#f5b84b" opacity="0.9"/>
  <circle cx="102" cy="452" r="64" fill="#15aabf" opacity="0.16"/>
  <path d="M90 112 C178 32 292 58 352 134 C416 214 534 181 620 244 C705 306 690 441 579 485 C470 528 359 473 280 492 C171 520 68 451 52 344 C37 238 22 174 90 112Z" fill="#ffffff" opacity="0.82"/>
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="250" height="154" rx="18" fill="#ffffff"/>
    <rect x="120" y="122" width="82" height="82" rx="16" fill="url(#coral)"/>
    <text x="161" y="170" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">A/B</text>
    <text x="224" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17131f">Games</text>
    <text x="224" y="179" font-family="Arial, sans-serif" font-size="15" fill="#655a6f">Vote, spin, laugh</text>
    <rect x="224" y="198" width="88" height="18" rx="9" fill="#ffe1e4"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="398" y="82" width="230" height="132" rx="18" fill="#ffffff"/>
    <rect x="424" y="110" width="60" height="60" rx="14" fill="url(#teal)"/>
    <text x="454" y="146" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Q</text>
    <text x="505" y="132" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17131f">Quizzes</text>
    <text x="505" y="161" font-family="Arial, sans-serif" font-size="14" fill="#655a6f">Find your style</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="156" y="304" width="216" height="132" rx="18" fill="#ffffff"/>
    <text x="184" y="346" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17131f">Polls</text>
    <rect x="184" y="366" width="142" height="16" rx="8" fill="#ffcfd7"/>
    <rect x="184" y="392" width="108" height="16" rx="8" fill="#beeaf0"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="276" width="236" height="172" rx="18" fill="#ffffff"/>
    <text x="460" y="322" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17131f">Community</text>
    <rect x="460" y="346" width="154" height="13" rx="7" fill="#f4d6ff"/>
    <rect x="460" y="371" width="116" height="13" rx="7" fill="#ffc9bf"/>
    <rect x="460" y="396" width="132" height="13" rx="7" fill="#c7f2dd"/>
  </g>
  <path d="M97 279 C130 257 164 257 197 279" fill="none" stroke="#ff6f61" stroke-width="12" stroke-linecap="round"/>
  <path d="M608 235 C636 216 663 217 690 237" fill="none" stroke="#15aabf" stroke-width="10" stroke-linecap="round"/>
</svg>
